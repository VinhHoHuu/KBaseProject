spring.application.name=first-homework

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/kbasedb
spring.datasource.username=kbaseuser
spring.datasource.password=kbasepassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# JWT Configuration
# Chuỗi bí mật này phải đủ dài (ít nhất 256-bit).
kbase.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
kbase.app.jwtExpirationMs=86400000 
# (Thời gian hết hạn của token: 86400000 mili-giây = 24 giờ)
