spring.application.name=first-homework

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kbasedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kbaseuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kbasepassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# JWT Configuration
# Chuỗi bí mật này phải đủ dài (ít nhất 256-bit).
kbase.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
kbase.app.jwtExpirationMs=86400000 
# (Thời gian hết hạn của token: 86400000 mili-giây = 24 giờ)

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.name=${MINIO_BUCKET_NAME:kbase-files}

# File Upload Limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.devtools.restart.enabled=false

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:mock_key_for_ci_tests}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.6-flash
gemini.max-output-tokens=8192
gemini.temperature=0.7
 