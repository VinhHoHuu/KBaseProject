version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kbase-postgres
    environment:
      POSTGRES_DB: kbasedb
      POSTGRES_USER: kbaseuser
      POSTGRES_PASSWORD: kbasepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: kbase-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  postgres_data:
  minio_data:
