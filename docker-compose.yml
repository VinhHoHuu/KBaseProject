version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kbase-postgres
    environment:
      POSTGRES_DB: kbasedb
      POSTGRES_USER: kbaseuser
      POSTGRES_PASSWORD: kbasepassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: quay.io/minio/minio:latest
    container_name: kbase-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always


  backend:
    build: .
    container_name: kbase-backend
    ports:
      - "8080:8080"
    environment:
      # Override application.properties to connect to docker containers
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kbasedb
      - MINIO_URL=http://minio:9000
    depends_on:
      - postgres
      - minio
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
