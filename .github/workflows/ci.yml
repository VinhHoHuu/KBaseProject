name: KBase CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest
    
    # Cấu hình Database cho môi trường CI vì code cần DB để chạy Context Test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kbasedb
          POSTGRES_USER: kbaseuser
          POSTGRES_PASSWORD: kbasepassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Backend Unit Tests
      run: mvn clean test

  frontend-test:
    name: Frontend Build & Test (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci || npm install
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Build (Sanity Check)
      run: npm run build

  auto-deploy:
    name: Auto Deploy to Production
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger Deploy Webhook
      env:
        DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$DEPLOY_HOOK_URL" ]; then
          echo "No deploy hook found in secrets. Skipping auto-deploy."
          exit 0
        fi
        echo "Triggering deployment..."
        curl -X POST "$DEPLOY_HOOK_URL"
        echo "Deployment triggered successfully."
